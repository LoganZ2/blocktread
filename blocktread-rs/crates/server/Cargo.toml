[package]
name = "blocktread-server"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
glam = "0.33"
quinn = "0.11.12"
rand = "0.10.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
blocktread_net = { version = "0.1.0", path = "../net" }
blocktread_shared = { version = "0.1.0", path = "../shared" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
argon2 = "0.6.0"
ring = "0.17.14"
