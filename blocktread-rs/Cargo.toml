[workspace]
resolver = "3"
members = ["crates/shared", "crates/net", "crates/server", "crates/client-core", "crates/client"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16

# what CI ships: a release build without symbols (about a third smaller)
[profile.dist]
inherits = "release"
strip = true
