# Builds the game client for macOS (one universal app for Apple Silicon and Intel) and Windows,
# and the server for Linux (static binaries, x86_64 and ARM). Every push and pull request gets them
# as workflow artifacts; a pushed tag v* also publishes them as a GitHub release and deploys that
# release to the game server (deploy.yml).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: voxwing-rs

jobs:
  test:
    name: tests (rules, server)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxwing-rs
          key: test
      - run: cargo test --release --locked -p voxwing_shared -p voxwing-server

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: voxwing-client }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: voxwing-client }
          # the C runtime linked in, so the game runs without the VC++ redistributable
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: voxwing-client.exe, rustflags: "-C target-feature=+crt-static" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxwing-rs
          key: ${{ matrix.target }}
      - run: cargo build --profile dist --locked -p voxwing-client --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: voxwing-rs/target/${{ matrix.target }}/dist/${{ matrix.exe }}
          if-no-files-found: error

  server:
    name: server ${{ matrix.arch }}-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    env:
      # musl: one static binary that runs on any Linux
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      # the version the server reports in its status file and log
      VOXWING_BUILD: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxwing-rs
          key: server-${{ matrix.arch }}
      - run: cargo build --profile dist --locked -p voxwing-server --target "$TARGET"
      - name: check it is static and runs
        run: |
          bin="target/$TARGET/dist/voxwing-server"
          file "$bin"
          "$bin" --help | head -2
          mkdir -p out && cp "$bin" "out/voxwing-server-${{ matrix.arch }}-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}-linux
          path: voxwing-rs/out/voxwing-server-${{ matrix.arch }}-linux
          if-no-files-found: error

  package:
    name: package
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
      - name: Voxwing.app (universal)
        run: |
          version=$(grep -m1 '^version' voxwing-rs/Cargo.toml | cut -d'"' -f2)
          app=dist/Voxwing.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/voxwing" \
            bin/bin-aarch64-apple-darwin/voxwing-client bin/bin-x86_64-apple-darwin/voxwing-client
          chmod +x "$app/Contents/MacOS/voxwing"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>体素星翼</string>
            <key>CFBundleDisplayName</key><string>体素星翼</string>
            <key>CFBundleIdentifier</key><string>io.github.loganz2.voxwing</string>
            <key>CFBundleExecutable</key><string>voxwing</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          # ad-hoc signature: not notarised, but macOS then offers to open it instead of calling it damaged
          codesign --force --deep -s - "$app"
          lipo -info "$app/Contents/MacOS/voxwing"
          ditto -c -k --norsrc --keepParent "$app" dist/Voxwing-macOS.zip
      - name: Voxwing.exe
        run: |
          cp bin/bin-x86_64-pc-windows-msvc/voxwing-client.exe dist/Voxwing.exe
          (cd dist && zip -q Voxwing-Windows.zip Voxwing.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: Voxwing-macOS
          path: dist/Voxwing-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Voxwing-Windows
          path: dist/Voxwing-Windows.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Voxwing-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/voxwing-server-*
          generate_release_notes: true

  # the server goes out with the client: same tag, same release
  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
