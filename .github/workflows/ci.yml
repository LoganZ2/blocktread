# Builds the game client for macOS (one universal app for Apple Silicon and Intel) and Windows,
# and the server for Linux (static binaries, x86_64 and ARM). Every push and pull request gets them
# as workflow artifacts; a pushed tag v* also publishes them as a GitHub release and deploys that
# release to the game server (deploy.yml).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: blocktread-rs

jobs:
  test:
    name: tests (rules, server)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocktread-rs
          key: test
      - run: cargo test --release --locked -p blocktread_shared -p blocktread-server

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: blocktread-client }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: blocktread-client }
          # the C runtime linked in, so the game runs without the VC++ redistributable
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: blocktread-client.exe, rustflags: "-C target-feature=+crt-static" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocktread-rs
          key: ${{ matrix.target }}
      - run: cargo build --profile dist --locked -p blocktread-client --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: blocktread-rs/target/${{ matrix.target }}/dist/${{ matrix.exe }}
          if-no-files-found: error

  server:
    name: server ${{ matrix.arch }}-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    env:
      # musl: one static binary that runs on any Linux
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      # the version the server reports in its status file and log
      BLOCKTREAD_BUILD: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocktread-rs
          key: server-${{ matrix.arch }}
      - run: cargo build --profile dist --locked -p blocktread-server --target "$TARGET"
      - name: check it is static and runs
        run: |
          bin="target/$TARGET/dist/blocktread-server"
          file "$bin"
          "$bin" --help | head -2
          mkdir -p out && cp "$bin" "out/blocktread-server-${{ matrix.arch }}-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}-linux
          path: blocktread-rs/out/blocktread-server-${{ matrix.arch }}-linux
          if-no-files-found: error

  package:
    name: package
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # gh, not actions/download-artifact (see release)
      - name: fetch binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p 'bin-*' -D bin
      - name: Blocktread.app (universal)
        run: |
          version=$(grep -m1 '^version' blocktread-rs/Cargo.toml | cut -d'"' -f2)
          app=dist/Blocktread.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/blocktread" \
            bin/bin-aarch64-apple-darwin/blocktread-client bin/bin-x86_64-apple-darwin/blocktread-client
          chmod +x "$app/Contents/MacOS/blocktread"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>方块战车</string>
            <key>CFBundleDisplayName</key><string>方块战车</string>
            <key>CFBundleIdentifier</key><string>io.github.loganz2.blocktread</string>
            <key>CFBundleExecutable</key><string>blocktread</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          # ad-hoc signature: not notarised, but macOS then offers to open it instead of calling it damaged
          codesign --force --deep -s - "$app"
          lipo -info "$app/Contents/MacOS/blocktread"
          ditto -c -k --norsrc --keepParent "$app" dist/Blocktread-macOS.zip
      - name: Blocktread.exe
        run: |
          cp bin/bin-x86_64-pc-windows-msvc/blocktread-client.exe dist/Blocktread.exe
          (cd dist && zip -q Blocktread-Windows.zip Blocktread.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: Blocktread-macOS
          path: dist/Blocktread-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Blocktread-Windows
          path: dist/Blocktread-Windows.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      # gh, not actions/download-artifact: that action sometimes hangs after its download is done
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p 'Blocktread-*' -p 'server-*' -D dist
          files=$(find dist -type f \( -name '*.zip' -o -name 'blocktread-server-*' \))
          echo "$files"
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes $files

  # the server goes out with the client: same tag, same release
  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
