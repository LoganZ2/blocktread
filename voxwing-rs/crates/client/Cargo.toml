[package]
name = "voxwing-client"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
bevy = { version = "0.20", features = ["wav", "system_font_discovery"] }
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
if-addrs = "0.15.0"
quinn = "0.11.12"
rand = "0.10.3"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
voxwing-server = { version = "0.1.0", path = "../server" }
voxwing_client_core = { version = "0.1.0", path = "../client-core" }
voxwing_net = { version = "0.1.0", path = "../net" }
voxwing_shared = { version = "0.1.0", path = "../shared" }
